<svg viewBox="0 0 32 18" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .l1 { animation: pulseDown 1.6s ease-in-out infinite; }
    .l2 { animation: pulseDown 1.6s ease-in-out 0.22s infinite; }
