    <rect x="39.5" y="36" width="5.8" height="17" rx="1" fill="#ffffff" stroke="#00c1d4" stroke-width="1.5"/>
    <polygon points="39.5,28.5 42.2,26 46.5,26 46.5,32.5 39.5,32.5" fill="#FFD100" stroke="#fef08a" stroke-width="1.2" stroke-linejoin="round"/>
