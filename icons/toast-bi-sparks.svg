<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .emblem { transform-origin: 32px 42px; animation: pulse 1.5s ease-in-out infinite; }
    .sl1 { transform-origin: 13px 21px; animation: shootLLg 1.5s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .sl2 { transform-origin: 23px 12px; animation: shootLSm 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.22s infinite; }
    .sr1 { transform-origin: 51px 19px; animation: shootRLg 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.12s infinite; }
    .sr2 { transform-origin: 41px 10px; animation: shootRSm 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.34s infinite; }
    @keyframes pulse { 0%, 100% { transform: translateY(0) scale(1); } 35% { transform: translateY(-2.5px) scale(1.04); } }
    @keyframes shootLLg {
      0% { opacity: 0; transform: translate(8px, 12px) scale(0.35); }
      35% { opacity: 1; transform: translate(0, 0) scale(1.1); }
      75% { opacity: 0.9; transform: translate(-3px, -5px) scale(0.95); }
      100% { opacity: 0; transform: translate(-5px, -9px) scale(0.4); }
    }
    @keyframes shootLSm {
      0% { opacity: 0; transform: translate(5px, 14px) scale(0.3); }
      40% { opacity: 1; transform: translate(0, 0) scale(1.12); }
      80% { opacity: 0.85; transform: translate(-2px, -5px) scale(0.9); }
      100% { opacity: 0; transform: translate(-4px, -8px) scale(0.35); }
    }
    @keyframes shootRLg {
      0% { opacity: 0; transform: translate(-8px, 12px) scale(0.35); }
      35% { opacity: 1; transform: translate(0, 0) scale(1.1); }
      75% { opacity: 0.9; transform: translate(3px, -5px) scale(0.95); }
      100% { opacity: 0; transform: translate(5px, -9px) scale(0.4); }
    }
    @keyframes shootRSm {
      0% { opacity: 0; transform: translate(-5px, 14px) scale(0.3); }
      40% { opacity: 1; transform: translate(0, 0) scale(1.12); }
      80% { opacity: 0.85; transform: translate(2px, -5px) scale(0.9); }
      100% { opacity: 0; transform: translate(4px, -8px) scale(0.35); }
    }
  </style>
