<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fly { transform-origin: 48px 18px; animation: flyLoop 1.8s ease-in-out infinite; }
    .wing { animation: flutter 0.14s linear infinite alternate; }
    @keyframes flyLoop {
      0% { transform: translate(-12px, 14px) rotate(-12deg); }
      35% { transform: translate(-2px, -3px) rotate(10deg); }
      70% { transform: translate(5px, -8px) rotate(-8deg); }
      100% { transform: translate(-12px, 14px) rotate(-12deg); }
    }
    @keyframes flutter { from { opacity: 0.45; } to { opacity: 1; } }
  </style>
  <path d="M34 32c2-8 10-12 15-8" stroke="#fda4af" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
  <g>
    <path d="M12 28l24-6v8" stroke="#f43f5e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="10" y="28" width="34" height="24" rx="4" fill="#2a0a18" stroke="#fb7185" stroke-width="2.4"/>
    <path d="M34 36h12v8H34a4 4 0 0 1 0-8z" fill="#1f0712" stroke="#fda4af" stroke-width="2"/>
    <circle cx="38" cy="40" r="1.5" fill="#fb7185"/>
    <line x1="16" y1="34" x2="28" y2="34" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="2 3" stroke-linecap="round"/>
  </g>
  <g class="fly">
    <ellipse class="wing" cx="46" cy="15" rx="3.8" ry="2" transform="rotate(-28 46 15)" fill="rgba(254, 205, 211, 0.85)"/>
    <ellipse class="wing" cx="51" cy="15" rx="3.8" ry="2" transform="rotate(28 51 15)" fill="rgba(254, 205, 211, 0.85)"/>
    <ellipse cx="48.5" cy="18" rx="3.2" ry="2.3" fill="#fb7185" stroke="#fff1f2" stroke-width="1.2"/>
  </g>
</svg>

