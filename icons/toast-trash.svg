<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .paper { transform-origin: 32px 15px; animation: throwIn 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .lid { transform-origin: 18px 25px; animation: openLid 1.5s ease-in-out infinite; }
    @keyframes throwIn {
      0% { opacity: 0; transform: translate(-12px, -8px) rotate(0deg) scale(0.85); }
      25% { opacity: 1; transform: translate(-2px, 0) rotate(75deg) scale(1); }
      70% { opacity: 1; transform: translate(0, 20px) rotate(190deg) scale(0.9); }
      85%, 100% { opacity: 0; transform: translate(0, 26px) rotate(240deg) scale(0.65); }
    }
    @keyframes openLid {
      0%, 15%, 85%, 100% { transform: rotate(0deg); }
      35%, 68% { transform: rotate(-24deg) translateY(-2px); }
    }
  </style>
  <g class="paper">
    <polygon points="32,9 37,11 39,16 34,20 28,19 26,14" fill="#fca5a5" stroke="#ef4444" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M29 13l5 3M35 12l-4 5" stroke="#7f1d1d" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g class="lid">
    <path d="M18 25h28" stroke="#ef4444" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M27 25v-3a1.5 1.5 0 0 1 1.5-1.5h7A1.5 1.5 0 0 1 37 22v3" stroke="#ef4444" stroke-width="2.2"/>
  </g>
  <g>
    <path d="M21 27h22l-2 25a2.5 2.5 0 0 1-2.5 2.3h-13A2.5 2.5 0 0 1 23 52l-2-25z" fill="#280707" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round"/>
    <line x1="28" y1="33" x2="28.5" y2="48" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="33" x2="35.5" y2="48" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>

