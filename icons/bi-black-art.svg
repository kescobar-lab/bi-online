<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none">
    <defs>
        <radialGradient id="artGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4b5563" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="figureGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#64748b"/>
            <stop offset="100%" stop-color="#334155"/>
        </linearGradient>
        <linearGradient id="figureGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#475569"/>
            <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
    </defs>
    
    <!-- Resplandor de fondo -->
    <circle cx="170" cy="120" r="110" fill="url(#artGlow)"/>

    <!-- Figura estilizada del atleta / escultura maya de Banco Bi -->
    <!-- Cabeza circular de la silueta -->
    <circle cx="95" cy="85" r="32" fill="url(#figureGrad1)"/>
    
    <!-- Torso y brazo izquierdo atlético -->
    <path d="M75 125c-20 15-35 45-30 75 10 3 40-10 50-25 15-22 18-35 15-50-12-3-25-3-35 0z" fill="url(#figureGrad2)"/>
    
    <!-- Pecho y postura dinámica -->
    <path d="M98 120c15 8 28 22 35 45 6 20-5 40-15 48-18 8-45 5-55-12 12-2 30-10 35-25 5-18-2-40 0-56z" fill="#334155"/>
    
    <!-- Máscara / Elemento escultórico tradicional maya a la derecha -->
    <g opacity="0.85">
        <!-- Perfil esculpido / jaguar ceremonial -->
        <path d="M150 70c15-20 45-30 65-15 18 12 25 35 18 55-5 15-20 28-35 32-15 5-32 0-42-12-10-12-12-35-6-60z" fill="#475569"/>
        <path d="M165 65c10-8 28-10 40-2 15 10 18 30 10 45-8 12-24 16-36 10-10-5-16-20-14-53z" fill="#1e293b"/>
        
        <!-- Detalles de tallado ceremonial en tonos carbón y plata -->
        <path d="M175 75c8-5 20-3 26 5 6 8 4 18-2 24-8 6-18 4-22-3-5-8-4-20-2-26z" fill="#64748b"/>
        <path d="M155 105c12 5 25 20 20 38-5 16-22 24-38 18-12-5-22-18-18-32 4-15 18-26 36-24z" fill="#334155"/>
        <path d="M185 115c15 0 35 15 32 35-2 18-18 30-36 28-15-2-28-15-26-32 2-16 15-31 30-31z" fill="#1e293b"/>
        
        <!-- Plumas / filigranas de relieve -->
        <path d="M210 50c18-10 38 2 42 22 3 18-10 35-28 38-16 2-30-8-32-24-2-18 8-32 18-36z" fill="#334155" opacity="0.6"/>
        <path d="M225 90c12 8 20 25 15 40-6 16-22 22-38 16-12-5-20-20-16-34 4-14 22-26 39-22z" fill="#475569" opacity="0.7"/>
    </g>

    <!-- Ondas cinéticas inferiores de relieve -->
    <path d="M40 215c30-10 70-15 110-5 35 8 70 2 105-15 15-7 30-5 45 5-20 25-70 35-120 30-55-5-105-2-140-15z" fill="#1e293b" opacity="0.9"/>
</svg>
