<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ghost { animation: float 2s ease-in-out infinite; }
    .shadow { transform-origin: 32px 55px; animation: pulse 2s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scaleX(1); opacity: 0.35; }
      50% { transform: scaleX(0.72); opacity: 0.18; }
    }
  </style>
  <ellipse class="shadow" cx="32" cy="55" rx="11" ry="2.8" fill="rgba(148, 163, 184, 0.32)"/>
  <g class="ghost">
    <path d="M18 30a14 14 0 0 1 28 0v18l-4.5-3.8-4.8 3.8-4.7-3.8-4.7 3.8-4.8-3.8L18 48V30z" fill="#1e293b" stroke="#cbd5e1" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="27" cy="29" r="2.2" fill="#f8fafc"/>
    <circle cx="37" cy="29" r="2.2" fill="#f8fafc"/>
    <ellipse cx="32" cy="35" rx="2.5" ry="3" fill="#94a3b8"/>
  </g>
</svg>

