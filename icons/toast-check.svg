<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ring { stroke-dasharray: 140; stroke-dashoffset: 140; animation: drawRing 0.55s ease-out 0.1s forwards; }
    .check { stroke-dasharray: 48; stroke-dashoffset: 48; animation: drawCheck 0.5s cubic-bezier(0.65, 0, 0.45, 1) 0.38s forwards; }
    @keyframes drawRing { to { stroke-dashoffset: 0; } }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }
  </style>
  <circle class="ring" cx="32" cy="32" r="21" fill="rgba(6, 78, 59, 0.55)" stroke="#10b981" stroke-width="2.6"/>
  <polyline class="check" points="21 32.5 28.5 40 43.5 24.5" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

