<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .coin { animation: drop 1.35s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .body { transform-origin: 33px 44px; animation: bounce 1.35s ease-in-out infinite; }
    @keyframes drop {
      0% { opacity: 0; transform: translateY(-10px) scale(0.85); }
      25% { opacity: 1; transform: translateY(0) scale(1); }
      65% { opacity: 1; transform: translateY(13px) scale(0.95); }
      78%, 100% { opacity: 0; transform: translateY(18px) scale(0.75); }
    }
    @keyframes bounce {
      0%, 55%, 100% { transform: scale(1, 1) translateY(0); }
      70% { transform: scale(1.06, 0.93) translateY(2px); }
      85% { transform: scale(0.98, 1.03) translateY(-1px); }
    }
  </style>
  <g class="coin">
    <circle cx="33" cy="14" r="7.5" fill="#eab308" stroke="#fef08a" stroke-width="2"/>
    <path d="M31 11.5h4M33 11.5v5" stroke="#713f12" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g class="body">
    <path d="M13 36c-3.5-1-4.5-4.5-2-6 1.8-1 3.5 1 2 2.5" stroke="#a3e635" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M22 48v6M28 49v5M39 49v5M44 48v6" stroke="#84cc16" stroke-width="3.2" stroke-linecap="round"/>
    <ellipse cx="33" cy="38" rx="16" ry="12.5" fill="#132a13" stroke="#a3e635" stroke-width="2.4"/>
    <path d="M38 26.5l4-5.5 3.5 6.5" fill="#132a13" stroke="#a3e635" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M48 34.5h4.5a2.5 2.5 0 0 1 2.5 2.5v3.5a2.5 2.5 0 0 1-2.5 2.5H48" fill="#132a13" stroke="#a3e635" stroke-width="2.2"/>
    <circle cx="43.5" cy="34.5" r="1.6" fill="#bef264"/>
    <line x1="28.5" y1="26" x2="37.5" y2="26" stroke="#fef08a" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>

