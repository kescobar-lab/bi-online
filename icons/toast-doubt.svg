<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .qmark { transform-origin: 32px 17px; animation: bob 1.4s ease-in-out infinite; }
    .person { transform-origin: 32px 44px; animation: tilt 1.4s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-6deg) scale(1); }
      50% { transform: translateY(-4px) rotate(8deg) scale(1.1); }
    }
    @keyframes tilt {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }
  </style>
  <g class="qmark">
    <path d="M28.5 11.5a4.2 4.2 0 1 1 5.6 4c-1.5.8-2.1 1.6-2.1 3" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="32" cy="22.5" r="1.6" fill="#fbbf24"/>
  </g>
  <g class="person">
    <circle cx="32" cy="34" r="7.5" fill="#291805" stroke="#f59e0b" stroke-width="2.4"/>
    <path d="M18 54c1.5-7.5 6.8-11.5 14-11.5s12.5 4 14 11.5" fill="#291805" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>

